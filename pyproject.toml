[project]
name = "mcp-claude-history"
version = "4.0.0"
description = "MCP server for searching Claude Code conversation history — SQLite FTS5 + jieba"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "orjson>=3.0.0",
    "jieba>=0.42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-claude-history = "server:main"
