[project]
name = "mcp-claude-history"
version = "0.5.0"
description = "MCP server for searching Claude Code conversation history — field-driven FTS5 search"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "orjson>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-claude-history = "server:main"
